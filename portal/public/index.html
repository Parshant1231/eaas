<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EaaS portal</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Environment-as-a-Service</h1>
    <p id="capacity" class="muted"></p>
  </header>

  <main>
    <p id="banner" class="banner" hidden></p>

    <section class="card">
      <h2>Create environment</h2>
      <form id="create-form" autocomplete="off">
        <label>Name
          <input id="name" required maxlength="20" pattern="[a-z][a-z0-9\-]{2,19}" placeholder="e.g. demo1" title="3-20 characters: lowercase letters, digits, hyphens; start with a letter">
        </label>
        <label>Size
          <select id="size">
            <option value="small">small (app only)</option>
            <option value="medium">medium (app + monitoring)</option>
          </select>
        </label>
        <label>TTL
          <select id="ttl">
            <option value="1">1 hour</option>
            <option value="2">2 hours</option>
            <option value="4">4 hours</option>
          </select>
        </label>
        <button type="submit" id="create-btn">Create</button>
      </form>
      <p id="message" role="status"></p>
    </section>

    <section class="card">
      <h2>Environments</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th><th>State</th><th>Owner</th><th>Size</th><th>TTL</th><th>Remaining</th><th>Links</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="env-body"></tbody>
        </table>
      </div>
      <p id="empty" class="muted" hidden>No environments yet.</p>
    </section>

    <section class="card" id="build-panel" hidden>
      <h2 id="build-title">Build</h2>
      <ol id="stages" class="stages"></ol>
      <pre id="log" aria-live="polite"></pre>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
