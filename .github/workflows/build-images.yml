name: build-images

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eaas-${{ matrix.component }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.component }}
          push: true
          tags: |
            ${{ env.IMAGE }}:0.1.0
            ${{ env.IMAGE }}:${{ github.sha }}
