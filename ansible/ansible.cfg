[defaults]
roles_path = roles
remote_user = ubuntu
private_key_file = ~/.ssh/eaas-key
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
nocows = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30
