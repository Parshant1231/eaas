- name: Base setup and monitoring agent on all nodes
  hosts: all
  become: true
  roles:
    - common
    - node_exporter

- name: k3s server
  hosts: role_server
  become: true
  roles:
    - k3s_server

- name: k3s agents
  hosts: role_agent
  become: true
  roles:
    - k3s_agent

- name: Report cluster state
  hosts: role_server
  become: true
  gather_facts: false
  tasks:
    - name: List nodes
      ansible.builtin.command: k3s kubectl get nodes -o wide
      register: nodes
      changed_when: false

    - name: Show nodes
      ansible.builtin.debug:
        msg: "{{ nodes.stdout_lines }}"
