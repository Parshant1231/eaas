services:
  jenkins:
    build:
      context: ..
      dockerfile: jenkins/Dockerfile
      args:
        TERRAFORM_VERSION: ${TERRAFORM_VERSION:?run scripts/build-jenkins-image.sh}
        AWSCLI_VERSION: ${AWSCLI_VERSION:?run scripts/build-jenkins-image.sh}
        KUBECTL_VERSION: ${KUBECTL_VERSION:?run scripts/build-jenkins-image.sh}
        HELM_VERSION: ${HELM_VERSION:?run scripts/build-jenkins-image.sh}
        TRIVY_VERSION: ${TRIVY_VERSION:?run scripts/build-jenkins-image.sh}
        CHECKOV_VERSION: ${CHECKOV_VERSION:?run scripts/build-jenkins-image.sh}
    image: eaas-jenkins:local
    container_name: eaas-jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      EAAS_STATE_BUCKET: ${EAAS_STATE_BUCKET:?run scripts/build-jenkins-image.sh}
      AWS_DEFAULT_REGION: ap-south-1
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
